# Supabase Configuration for VibeChannel
# See: https://supabase.com/docs/guides/cli/config

[project]
id = "vibechannel"
name = "VibeChannel"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["vscode://lucasygu.vibechannel/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.external.github]
enabled = true
# client_id and secret are set via environment variables:
# GOTRUE_EXTERNAL_GITHUB_CLIENT_ID
# GOTRUE_EXTERNAL_GITHUB_SECRET

[realtime]
enabled = true

[analytics]
enabled = false

[functions]
# Edge functions configuration
verify_jwt = true
